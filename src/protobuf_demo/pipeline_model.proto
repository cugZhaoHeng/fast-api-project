syntax = "proto3";

package pipeline.model;

option java_package = "com.baidu.pipeline.common.pojo.dto.model";
option java_outer_classname = "ModelFullParamProto";
option java_multiple_files = true;

import "google/protobuf/struct.proto";

message ModelFullParam {
  // JSON: "controlPoint": { "headers": [...], "data": [ [...], [...] ] }
  ModelInputDTO controlPoint = 1;

  // JSON: "inputKey": [...]
  repeated string inputKey = 2;

  // JSON: "inputValue": { "2026/1/14 8:00:00": [1.0, 2.0, ...], ... }
  // 用 ListValue 让 value 在 JSON 中直接是数组（不再出现 { "values": [...] } 包装）
  map<string, google.protobuf.ListValue> inputValue = 3;

  // JSON: "periodForecast": 24
  int32 periodForecast = 4;

  repeated StationPredictDTO stationPredictDtos = 5;

  repeated ModelOptimizeParamDTO modelOptimizeParamDtos = 6;

  // JSON: "modelUpdateTime": "..."
  string modelUpdateTime = 7;

  // JSON: "modelUpdateParam": { "pipelineStore": [ { "pipelineId": "...", "value": "..." } ] }
  ModelUpdateParam modelUpdateParam = 8;

  // JSON: "reqType": 2
  int32 reqType = 9;
}

message ModelInputDTO {
  // JSON: "headers": ["TIME", ...]
  repeated string headers = 1;

  // JSON: "data": [
  //   ["2026/1/14 8:00:00", "9.6", "5804", ...],
  //   ...
  // ]
  repeated google.protobuf.ListValue data = 2;
}

message ModelUpdateParam {
  // JSON: "pipelineStore": [ { "pipelineId":"000", "value":"-500" } ]
  repeated PipelineStoreItem pipelineStore = 1;
}

message PipelineStoreItem {
  // JSON: "pipelineId": "000"
  string pipelineId = 1;

  // JSON: "value": "-500"
  string value = 2;
}

message StationPredictDTO {
  string stationId = 1;
  double inputPress = 2;
  double outputPress = 3;
  int64 time = 4;
}

message ModelOptimizeParamDTO {
  int32 requestSource = 1;
  string stationId = 2;
  string name = 3;
  int64 triggerTime = 4;
  int32 type = 5;
  google.protobuf.Value value = 6;
  google.protobuf.Value threshold = 7;
  string triggerReason = 8;
  string firstStationId = 9;
  string secondStationId = 10;
}
